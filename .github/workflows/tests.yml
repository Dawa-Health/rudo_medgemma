name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = production (Vercel default, pinned in .python-version).
        # 3.10 = minimum for local development (README). Vercel itself supports only 3.12-3.14.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned production + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      # The production entry point must import with only production settings (no secrets).
      - name: Startup check
        run: python -c "from api.index import app; assert {r.rule for r in app.url_map.iter_rules()} >= {'/', '/webhook', '/agent-timeout'}"

      # No secrets are passed to this job: the suite uses synthetic credentials and blocks
      # all network access. The step fails if coverage is below fail_under (80%) in .coveragerc.
      - name: Run tests with coverage gate
        run: PYTHON="$(command -v python)" bash scripts/coverage.sh --cov-fail-under=80

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 14
